runtime_mode: "live_strict"
live_poll_seconds: 5
live_expiry_scope: "0-30d"
live_selected_expiries: []
snapshot_eod_time: "20:00"
snapshot_timezone: "America/New_York"
market_close_freeze_time: "17:00"
final_prices_refresh_time: "17:30"
oi_refresh_time: "20:30"
after_hours_refresh_policy: "oi_merge_only"
offline_bootstrap_mode: "parquet_latest_final"
price_change_abs_tol: 0.0001
parquet_root: "data/raw"
derived_parquet_root: "data/derived"
max_retries: 3
retry_backoff_seconds: 1.0
ssvi_warm_start: true
ssvi_fit_space: "log"
ssvi_enable_space_compare: true
ssvi_compare_fit_space: "strike"
ssvi_backend: "cpp"
parity_rate: 0.04
parity_dividend: 0.0
parity_eep_mode: "hybrid"
parity_max_pairs: 40
parity_tree_steps: 120
parity_luba_method: luba_2pt
parity_rim_nodes: 100
fdm_backend: "cpp"
use_yfinance_rate_curve: true
rate_curve_refresh_seconds: 900
use_projected_dividends: true
dividend_projection_horizon_years: 3.0
dividend_lookback_events: 8
state_max_symbols: 3
state_budget_raw_mb: 128
state_budget_greeks_mb: 256
state_budget_ssvi_mb: 32
state_budget_dispatch_mb: 16
state_budget_parity_mb: 64
state_budget_parity_detail_mb: 128
state_budget_diagnostics_mb: 64
state_budget_overlay_mb: 128
state_max_rows_raw: 10000
state_max_rows_greeks: 10000
state_max_rows_ssvi: 2000
state_max_rows_diagnostics: 2000
ui_apply_interval_ms: 50
ui_max_pending_per_symbol: 1
ui_overlay_default_mode: "residual"
ui_overlay_dual_mode_enabled: false
ui_apply_p95_limit_ms: 50.0
ui_auto_degrade_enabled: true
stream_lock_enforced: true
nonconvergence_alert_threshold: 5
telemetry_emit_interval_sec: 30
memory_soft_limit_mb: 1300
memory_hard_limit_mb: 1536
memory_check_interval_sec: 5
memory_trim_cooldown_sec: 30
diag_flush_interval_sec: 120
parquet_flush_interval_sec: 5
parquet_flush_max_rows: 5000
