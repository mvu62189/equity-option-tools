[build-system]
requires = ["setuptools>=69", "wheel", "pybind11>=2.11", "cmake>=3.27", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pipeline-mvp"
version = "0.1.0"
description = "Python-first quant pipeline MVP with C++20/pybind11 skeleton"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.8.0",
  "pyarrow>=17.0.0",
  "duckdb>=1.1.0",
  "yfinance>=0.2.50",
  "PyYAML>=6.0.2",
  "pydantic>=2.8.2",
  "numpy>=2.1.1",
  "scipy>=1.14.1",
  "psutil>=6.0.0",
  "pytz>=2024.2",
  "PySide6>=6.7.0",
  "pyqtgraph>=0.13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-qt>=4.4.0",
  "ruff>=0.6.4",
  "mypy>=1.11.2",
  "types-PyYAML>=6.0.12.20240917"
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
asyncio_mode = "auto"
markers = [
  "integration: marks integration tests",
  "perf: marks performance benchmarks"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
